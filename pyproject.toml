[project]
name = "heart-valve-defect-detection"
version = "0.1.0"
description = "Research reference implementation of AI-assisted TTE heart-valve analysis with a mandatory clinician-review workflow"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
