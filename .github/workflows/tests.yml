name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch is not installed: tests/conftest.py supplies a minimal stub when it is absent.
      - name: Install dependencies
        run: pip install numpy opencv-python-headless pydicom pytest pytest-cov
      - name: Run tests
        run: python -m pytest -q --cov=. --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
