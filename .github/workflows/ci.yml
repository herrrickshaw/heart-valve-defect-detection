name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (lightweight; torch/cv2/sklearn are stubbed in tests)
        run: pip install pytest ruff numpy
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
